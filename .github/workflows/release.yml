name: Release image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - id: imgtags
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            ref=main
          fi
          delim="tags_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "yaml<<${delim}"
            sh scripts/image-tags.sh "$ref" | while read -r t; do
              echo "type=raw,value=${t}"
            done
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinimesh/platform-operator
          tags: ${{ steps.imgtags.outputs.yaml }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Release notes
        id: notes
        if: github.ref_type == 'tag'
        run: |
          if printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            body=$(printf '%s\n\n%s\n' \
              "This release is for testing, not for production." \
              "\`ghcr.io/infinimesh/platform-operator:${GITHUB_REF_NAME}\`.")
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            body="\`ghcr.io/infinimesh/platform-operator:${GITHUB_REF_NAME}\` and \`:latest\`."
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          delim="notes_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "body<<${delim}"
            printf '%s\n' "$body"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.notes.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /orgs/infinimesh/packages/container/platform-operator -f visibility=public || true
          check="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            check=latest
          fi
          image="infinimesh/platform-operator"
          tok=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${image}:pull" | jq -er .token)
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${tok}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${image}/manifests/${check}"
