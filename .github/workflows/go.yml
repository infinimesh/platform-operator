name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"

      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: image tags
        run: sh scripts/image-tags_test.sh

      - name: Vet API packages
        run: go vet -mod=vendor ./pkg/apis/infinimesh

      - name: Test API packages
        run: go test -mod=vendor ./pkg/apis/infinimesh
