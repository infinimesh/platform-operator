name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: make fmt-check

      - name: image tags
        run: sh scripts/image-tags_test.sh

      - name: go vet
        run: go vet -mod=vendor ./pkg/... ./cmd/...

      - name: race
        run: make race

      - name: fuzz
        run: make test-fuzz
