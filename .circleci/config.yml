# Use the latest 2.1 version of CircleCI pipeline process engine. See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1
jobs:
  build:
    working_directory: /go/src/github.com/infinimesh/enterprise_operator
    docker:
      - image: circleci/golang:1.15.8
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Run tests
          command: |
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests.xml
      - store_test_results:
          path: /tmp/test-reports
  ent_op_img:
    docker:
      - image: circleci/golang:1.15.8
    working_directory: /go/src/github.com/infinimesh/enterprise_operator
    steps:
      - setup_remote_docker
      - checkout
      - run: go mod verify
  quick_build:
    machine: true 
    steps:
      - checkout
      - run:
          name: Build Operator
          command: |
            if [ " ${CIRCLE_BRANCH}" == "master" ]; then 
                TAG=0.1.$CIRCLE_BUILD_NUM
                docker build -t infinimesh/enterprise_operator:${TAG} -f Dockerfile .
                docker tag app "${ECR_ENDPOINT}/app:${CIRCLE_SHA1}"
            elif [ " ${CIRCLE_BRANCH}" == "infinidev" ]; then
                TAG=0.1.$CIRCLE_BUILD_NUM
                docker build -t infinimesh/enterprise_operator:infinidev-${TAG} -f Dockerfile .
                docker tag app "${ECR_ENDPOINT}/app:${CIRCLE_SHA1}"
               else 
                echo 1
            fi
      - deploy:
          name: Push application Docker image
          command: |
            if [ "$ {CIRCLE_BRANCH}" == "infinidev" ]; then
            	echo 1
            fi 
              
workflows:
    version: 2
    all:
      jobs:
#        - build
#        - ent_op_img
         - quick_build  
