# Use the latest 2.1 version of CircleCI pipeline process engine. See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1
jobs:
  build:
    working_directory: /go/src/github.com/infinimesh/enterprise_operator
    docker:
      - image: circleci/golang:1.15.8
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Run tests
          command: |
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests.xml
      - store_test_results:
          path: /tmp/test-reports
  ent_op_img:
    docker:
      - image: circleci/golang:1.15.8
    working_directory: /go/src/github.com/infinimesh/enterprise_operator
    steps:
      - setup_remote_docker
      - checkout
      - run: go mod verify
  quick_build:
    machine: true 
    steps:
      - checkout
      - run:
          name: Build Operator
          command: |
                docker build -t infinimesh/enterprise_operator:latest -f Dockerfile .
      - deploy:
          name: Push application Docker image
          command: |
            if [ "$ {CIRCLE_BRANCH}" == "master" ]; then
                TAG=1.0.$CIRCLE_BUILD_NUM
                echo $TAG
            	docker login -u iamapikey -p $IAMAPIKEY de.icr.io
                echo $IAMAPIKEY
                docker tag operator-${TAG} iamapikey/infinihealth
                docker push iamapikey/infinihealth
            fi 
              
workflows:
    version: 2
    all:
      jobs:
#        - build
#        - ent_op_img
         - quick_build  
